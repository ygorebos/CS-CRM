# Stack local de dependências externas para o DeskcommCRM.
#
# Sobe apenas o WAHA (Plus / NOWEB) pra desenvolvimento. Postgres + Auth + Storage
# vêm do Supabase Cloud (ou supabase local CLI separadamente, conforme o time preferir).
#
# Uso:
#   1. Copie .env.example -> .env.local e preencha WAHA_API_KEY (plaintext)
#   2. Gere o hash: echo -n "$WAHA_API_KEY" | shasum -a 512 | awk '{print $1}'
#   3. Cole esse hash em WAHA_API_KEY abaixo (NÃO o plaintext)
#   4. docker compose up -d
#   5. Acesse http://localhost:3030/dashboard/ (UI do WAHA Plus)
#      (host port 3030 — :3000 fica reservado pra outros dev tools como Remotion)
#
# Em prod, WAHA roda em VPS dedicada (Hostgator) atrás de Nginx (proxy_buffering off
# pra SSE). docker-compose aqui é DEV ONLY.

version: "3.9"

services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Hash SHA512 hex da api key (NÃO plaintext). Cliente envia plaintext em X-Api-Key.
      #
      # O prefixo `sha512:` é obrigatório e é ele que manda o WAHA HASHEAR o
      # X-Api-Key recebido antes de comparar. Sem o prefixo, o WAHA compara
      # LITERAL: o app manda o plaintext e toma 401 em toda chamada, enquanto
      # quem mandar o hash entra. O docker-compose.prod.yml já traz o prefixo —
      # aqui faltava, então o WAHA de desenvolvimento nunca autenticou o app.
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      # Webhook base URL — precisa ser pública (use ngrok/cloudflared em dev).
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria o próprio WAHA e o webhook nunca chegaria. Porta 3002:
      # a stack da fusão é isolada do checkout principal (3001 é do gov-loop).
      # O default aponta para a 3003, que é a stack isolada da fusão. Quem roda o
      # app pelo caminho do README (`npm run dev`, porta 3000) precisa apontar
      # WAHA_HOOK_BASE_URL para lá, senão o webhook sai para uma porta onde não
      # há ninguém e o silêncio parece "o WhatsApp não mandou nada".
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message,message.any,message.ack,session.status,state.change"
      # HMAC SHA512 do payload, validado server-side via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Engine NOWEB por default (mais leve, ~150MB; estável). O env é
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE NÃO existe no WAHA e caía
      # silenciosamente no default WEBJS (browser, trava a sessão).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Storage de mídia: Supabase Storage via Backend (NÃO inline base64).
      #
      # Os dois envs abaixo NÃO são enfeite. Sem eles o WAHA grava em
      # /tmp/whatsapp-files (default) e o volume waha-media:/app/.media montado
      # logo abaixo fica de enfeite — mídia some a cada restart do contêiner.
      # E o WHATSAPP_FILES_LIFETIME default é 180 SEGUNDOS: o worker de
      # media.persist_requested tem 3 minutos para baixar antes do WAHA apagar.
      # Qualquer atraso — fila acumulada, worker parado, retry — vira
      # `waha_media_404` e a mídia se perde para sempre. Uma hora dá folga de
      # sobra e mantém o disco limitado; o dono final do arquivo é o Supabase
      # Storage, não o WAHA.
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "3600"
      WAHA_DASHBOARD_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      # /ping é o único endpoint sem auth desta build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Postgres = Supabase (SUPABASE_DB_URL no
  # .env.local). Sobe junto do WAHA: `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # dentro do container, localhost é o próprio worker — o WAHA está na rede
      # do compose (serviço waha, porta interna 3000). Sobrepõe o .env.local.
      WAHA_API_BASE_URL: http://waha:3000
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Gateway multicanal em modo RELAY (spec 001): recebe dos provedores,
  # normaliza para um envelope único e ENTREGA ao CRM por HTTP assinado. Em
  # relay ele não persiste em banco nenhum — em particular, não escreve no banco
  # do CRM: receber uma mensagem aqui não é um INSERT, dispara agente,
  # follow-up, guardrails, auditoria e event_log.
  #
  # Atrás de um profile de propósito: `docker compose up -d` continua subindo só
  # WAHA + worker, como antes. Para exercitar o caminho novo:
  #   docker compose --profile gateway up -d
  #
  # A imagem ainda não é publicada. Até que seja, construa uma vez a partir do
  # checkout do gateway:
  #   docker build -t deskcomm/gateway:dev /caminho/para/gateway_go
  # O caminho não entra aqui de propósito — é externo ao repositório, e um clone
  # não o tem.
  gateway:
    image: ${GATEWAY_IMAGE:-deskcomm/gateway:dev}
    container_name: deskcomm-gateway
    profiles: ["gateway"]
    restart: unless-stopped
    environment:
      # Sem este modo o processo entra em pânico no boot: internal/config/config.go
      # trata SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY como mustGetEnv, e o
      # gateway não sobe sem um banco para persistir — que aqui ninguém leria.
      GATEWAY_MODE: relay
      PORT: "8080"
      # Para onde o envelope normalizado é entregue. host.docker.internal porque
      # o app Next roda no HOST em dev; a porta segue a mesma convenção do
      # WAHA_HOOK_BASE_URL acima.
      CRM_BASE_URL: ${GATEWAY_CRM_BASE_URL:-http://host.docker.internal:3003}
      # Fila de entrega durável. Sem estado em disco, "nada se perde" é falso:
      # basta reiniciar o contêiner para perder o que estava em voo.
      GATEWAY_QUEUE_DIR: /var/lib/gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Preso ao loopback: em dev quem fala com ele é o app na mesma máquina.
      # Publicar em 0.0.0.0 exporia um receptor de webhook sem proxy na frente.
      - "127.0.0.1:8090:8080"
    volumes:
      - gateway-queue:/var/lib/gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  waha-data:
  waha-media:
  gateway-queue:
